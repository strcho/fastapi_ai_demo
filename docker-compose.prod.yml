services:
  web:
    build: .
    container_name: fastapi_app_prod
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

